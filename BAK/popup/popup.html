<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網頁行事曆便利貼 - 設定與快速新增</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- 頂部標題區 -->
    <header class="header">
      <div class="logo-area">
        <span class="logo-icon">📅</span>
        <h2>行事曆便利貼</h2>
      </div>
      <span class="version-badge">v1.5</span>
    </header>

    <!-- 分頁切換 Tab -->
    <div class="tab-nav">
      <button type="button" class="tab-btn active" data-tab="tab-settings">⚙️ 偏好設定</button>
      <button type="button" class="tab-btn" data-tab="tab-add-event">➕ 新增行程</button>
    </div>

    <!-- TAB 1: 偏好設定 -->
    <div id="tab-settings" class="tab-pane active">
      <!-- 快速開關 -->
      <div class="quick-toggle-section">
        <div class="toggle-info">
          <span class="toggle-title">在網頁上呈現便利貼</span>
          <span class="toggle-subtitle">僅呈現有行程之日期，支援自由拖曳</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="enableStickyToggle" checked>
          <span class="slider round"></span>
        </label>
      </div>

      <!-- 便利貼尺寸設定 -->
      <section class="card">
        <div class="card-header">
          <span class="card-title">便利貼呈現尺寸</span>
        </div>
        <div class="size-selector">
          <button type="button" class="btn-size active" data-size="normal">
            <span class="size-title">標準大小 (100%)</span>
            <span class="size-desc">寬 220px・字體適中</span>
          </button>
          <button type="button" class="btn-size" data-size="compact">
            <span class="size-title">精簡迷你 (約 50%)</span>
            <span class="size-desc">寬 135px・微型小字</span>
          </button>
        </div>
      </section>

      <!-- 日曆讀取範圍設定 -->
      <section class="card">
        <div class="card-header">
          <span class="card-title">日曆來源範圍</span>
        </div>
        <select id="calendarScopeSelect" class="styled-select">
          <option value="primary" selected>僅限個人主要日曆 (推薦，避免混入共用日曆)</option>
          <option value="owned">個人建立與擁有的日曆 (排除他人共用)</option>
          <option value="all">所有日曆 (包含已訂閱與他人共用日曆)</option>
        </select>
      </section>

      <!-- GAS 網址設定區 (自動儲存) -->
      <section class="card">
        <div class="card-header">
          <span class="card-title">Google Apps Script (GAS) 部署網址</span>
          <span class="badge-saved" id="autoSavedBadge">已自動儲存 ✓</span>
        </div>
        <p class="card-desc">請使用**要呈現日曆之 Google 帳號**登入並建立 GAS 專案：</p>
        
        <div class="input-group">
          <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec" spellcheck="false">
        </div>
        <div class="help-links">
          <a href="../README.md" target="_blank" id="openReadmeLink">📖 如何取得 GAS 網址與多帳號設定說明？</a>
        </div>
      </section>

      <!-- 呈現天數設定 -->
      <section class="card">
        <div class="card-header">
          <span class="card-title">搜尋未來行程天數</span>
        </div>
        <div class="days-selector">
          <button type="button" class="btn-day active" data-days="7">7 天</button>
          <button type="button" class="btn-day" data-days="14">14 天</button>
          <button type="button" class="btn-day" data-days="30">一個月 (30天)</button>
          <button type="button" class="btn-day" data-days="custom">自訂</button>
        </div>
        <div class="custom-days-box" id="customDaysBox" style="display: none;">
          <label for="customDaysInput">天數 (1 ~ 90 天)：</label>
          <input type="number" id="customDaysInput" min="1" max="90" value="7">
        </div>
      </section>

      <!-- 狀態與同步按鈕 -->
      <div class="status-box" id="statusBox">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">尚未設定 GAS 網址</span>
      </div>

      <div class="action-buttons">
        <button type="button" id="saveAndSyncBtn" class="btn btn-primary">
          <span class="btn-icon">🔄</span> 立即同步行程
        </button>
      </div>
    </div>

    <!-- TAB 2: 快速新增行程至 Google 日曆 -->
    <div id="tab-add-event" class="tab-pane">
      <form id="addEventForm" class="add-event-form">
        <div class="form-group">
          <label for="eventTitle">行程標題 <span class="req">*</span></label>
          <input type="text" id="eventTitle" placeholder="例如：專案進度會議、聚餐" required>
        </div>

        <div class="form-group-checkbox">
          <label>
            <input type="checkbox" id="isAllDayEvent">
            <span>全天行程</span>
          </label>
        </div>

        <div class="form-row" id="timeRow">
          <div class="form-group half">
            <label for="eventStart">開始時間 <span class="req">*</span></label>
            <input type="datetime-local" id="eventStart" required>
          </div>
          <div class="form-group half" id="endGroup">
            <label for="eventEnd">結束時間</label>
            <input type="datetime-local" id="eventEnd">
          </div>
        </div>

        <div class="form-group" id="allDayDateGroup" style="display: none;">
          <label for="allDayDate">行程日期 <span class="req">*</span></label>
          <input type="date" id="allDayDate">
        </div>

        <div class="form-group">
          <label for="eventLocation">地點 (選填)</label>
          <input type="text" id="eventLocation" placeholder="例如：會議室 B 或 線上 Google Meet">
        </div>

        <div class="form-group">
          <label for="eventDesc">備註說明 (選填)</label>
          <textarea id="eventDesc" rows="2" placeholder="行程相關備註..."></textarea>
        </div>

        <div class="action-buttons">
          <button type="submit" id="submitAddEventBtn" class="btn btn-success">
            <span class="btn-icon">➕</span> 加入 Google 日曆並更新便利貼
          </button>
        </div>

        <div class="add-status-msg" id="addStatusMsg"></div>
      </form>
    </div>

    <!-- 底部版權與 CC 授權資訊 -->
    <footer class="footer-credit">
      <div class="author-line">
        Made by <a href="https://kentxchang.blogspot.tw" target="_blank" rel="noopener noreferrer" class="author-link">阿剛老師</a>
      </div>
      <div class="cc-license-line">
        <span class="cc-badge">CC BY-NC-SA 4.0</span>
        <span>本工具採創用 CC 姓名標示-非商業性-相同方式分享 4.0 國際授權條款釋出</span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
